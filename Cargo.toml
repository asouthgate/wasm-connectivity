[package]
name = "lmConnect"
version = "0.1.1"
edition = "2021"
description = "Low-memory Biological Connectivity Analysis"
license-file = "COPYING.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/COPYING.md"]

[lib]
name = "lm_connect"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sprs = "0.11"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
geo = "0.28"
geojson = "0.24"
csv = "1"
tiff = { version = "0.9", optional = true }
image = { version = "0.24", default-features = false, features = ["png"], optional = true }

[features]
bin = ["tiff", "image"]
instrumentation-profile = []
developer = ["bin", "instrumentation-profile"]

[[bin]]
name = "lmc-resistance"
path = "src/bin/resistance_pipeline.rs"
required-features = ["bin"]

[[bin]]
name = "lmc-current"
path = "src/bin/scenario_solve.rs"
required-features = ["bin"]

[[bin]]
name = "lmc-profile"
path = "src/bin/instrumentation_profile.rs"
required-features = ["developer"]

[[bin]]
name = "lmc-roost"
path = "src/bin/roost_locate/main.rs"
required-features = ["bin"]

[profile.release-prof]
inherits = "release"
debug = 1
