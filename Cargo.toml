[package]
name = "wasm-connect"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sprs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
geo = "0.28"
geojson = "0.24"
tiff = { version = "0.9", optional = true }
image = { version = "0.25", optional = true }

[features]
bin = ["tiff", "image"]

[[bin]]
name = "resistance-pipeline"
path = "src/bin/resistance_pipeline.rs"
required-features = ["bin"]

[[bin]]
name = "prof-solve"
path = "src/bin/prof_solve.rs"
required-features = ["bin"]

[dev-dependencies]
image = "0.25"

[profile.release-prof]
inherits = "release"
debug = 1
