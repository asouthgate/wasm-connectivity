<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WASM Connectivity</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 13px monospace; background: #111; color: #ccc; padding: 12px; }
h1 { font-size: 1em; margin-bottom: 8px; }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.btn { padding: 5px 12px; border: 1px solid #444; background: #222; color: #ccc; cursor: pointer; font: 12px monospace; }
.btn:hover { border-color: #888; }
.btn.active { background: #238636; border-color: #238636; color: #fff; }
.btn.run { background: #238636; border-color: #238636; color: #fff; font-weight: bold; }
.btn.run:hover { background: #2ea043; }
.btn.run:disabled { opacity: .4; cursor: not-allowed; }
input[type=file] { display: none; }
.status { font-size: .8em; color: #888; margin: 4px 0; }

.layout { display: flex; gap: 12px; }
.sidebar { width: 200px; flex-shrink: 0; }
.main { flex: 1; min-width: 0; }

.preset-group { margin-bottom: 10px; }
.preset-group h3 { font-size: .7em; color: #666; text-transform: uppercase; margin: 4px 0; letter-spacing: 1px; }
.preset { padding: 4px 8px; border: 1px solid #333; border-radius: 2px; cursor: pointer; margin-bottom: 2px; font-size: .75em; }
.preset:hover { background: #1a1a1a; border-color: #555; }
.preset.sel { border-color: #58a6ff; color: #58a6ff; }

.maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.map-panel { border: 1px solid #333; }
.map-panel .label { font-size: .65em; padding: 3px 6px; background: #1a1a1a; border-bottom: 1px solid #333; color: #888; display: flex; justify-content: space-between; }
.map-panel canvas { display: block; image-rendering: pixelated; width: 100%; }

.resistances { margin-top: 10px; }
.resistances table { border-collapse: collapse; font-size: .75em; }
.resistances td, .resistances th { padding: 2px 8px; border: 1px solid #333; }
.resistances td { text-align: right; }
.resistances th { background: #1a1a1a; color: #888; }

/* loading overlay */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.75); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
.modal.show { display: flex; }
.spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #58a6ff; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.modal .msg { color: #888; font-size: .85em; }

.scale-toggles { display: flex; gap: 2px; font-size: .65em; }
.scale-toggles span { padding: 1px 4px; border: 1px solid #333; cursor: pointer; }
.scale-toggles span.on { background: #238636; border-color: #238636; color: #fff; }

.legend { display: flex; gap: 4px; align-items: center; font-size: .6em; padding: 2px 6px; color: #666; }
.legend-bar { width: 60px; height: 8px; border-radius: 2px; }
</style>
</head>
<body>
<h1>WASM Connectivity</h1>

<div class="row">
  <button class="btn run" id="solveBtn" disabled>Run</button>
  <span id="timer"></span>
  <span style="font-size:.75em;color:#555">custom:</span>
  <label class="btn" for="resFile">+ res</label>
  <input type="file" id="resFile" accept=".asc,.txt">
  <span id="resName" style="font-size:.7em;color:#555;max-width:130px;overflow:hidden;white-space:nowrap">—</span>
  <label class="btn" for="ptFile">+ pts</label>
  <input type="file" id="ptFile" accept=".asc,.txt">
  <span id="ptName" style="font-size:.7em;color:#555;max-width:130px;overflow:hidden;white-space:nowrap">—</span>
</div>

<div class="status" id="status">Pick a preset to begin.</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="maps" id="maps" style="display:none">
      <div class="map-panel">
        <div class="label"><span>Resistance <span id="dimRes"></span></span><div class="scale-toggles"><span class="on" data-map="res" data-scale="log">log</span><span data-map="res" data-scale="lin">lin</span></div></div>
        <canvas id="canvasRes"></canvas>
        <div class="legend"><span>lo</span><div class="legend-bar" style="background:linear-gradient(to right,#00f,#0ff,#0f0,#ff0,#f00)"></div><span>hi</span></div>
      </div>
      <div class="map-panel">
        <div class="label"><span>Focal Points <span id="dimPts"></span></span></div>
        <canvas id="canvasPts"></canvas>
        <div class="legend">■ point</div>
      </div>
      <div class="map-panel">
        <div class="label"><span>Current <span id="dimCur"></span></span><div class="scale-toggles"><span class="on" data-map="cur" data-scale="log">log</span><span data-map="cur" data-scale="lin">lin</span></div></div>
        <canvas id="canvasCur"></canvas>
        <div class="legend"><span>lo</span><div class="legend-bar" style="background:linear-gradient(to right,#001,#00f,#0ff,#ff0,#f00)"></div><span>hi</span></div>
      </div>
    </div>
    <div class="resistances" id="resistances"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="spinner"></div>
  <div class="msg">Solving...</div>
</div>

<script type="module">
import init, { solve_connectivity } from '../pkg/wasm_connect.js';

const PRESETS = [
  { group: '200×200', items: [
    { id:'u200', name:'uniform',     res:'test_grids/uniform_200_res.asc',    pts:'test_grids/uniform_200_pts.asc' },
    { id:'t200', name:'two corridors', res:'test_grids/two_paths_200_res.asc',  pts:'test_grids/two_paths_200_pts.asc' },
    { id:'r200', name:'random terrain', res:'test_grids/rand_terrain_200_res.asc', pts:'test_grids/rand_terrain_200_pts.asc' },
  ]},
  { group: '300×300', items: [
    { id:'u300', name:'uniform',     res:'test_grids/uniform_300_res.asc',    pts:'test_grids/uniform_300_pts.asc' },
    { id:'t300', name:'two corridors', res:'test_grids/two_paths_300_res.asc',  pts:'test_grids/two_paths_300_pts.asc' },
    { id:'r300', name:'random terrain', res:'test_grids/rand_terrain_300_res.asc', pts:'test_grids/rand_terrain_300_pts.asc' },
  ]},
  { group: '500×500', items: [
    { id:'u500', name:'uniform',     res:'test_grids/uniform_500_res.asc',    pts:'test_grids/uniform_500_pts.asc' },
    { id:'t500', name:'two corridors', res:'test_grids/two_paths_500_res.asc',  pts:'test_grids/two_paths_500_pts.asc' },
    { id:'r500', name:'random terrain', res:'test_grids/rand_terrain_500_res.asc', pts:'test_grids/rand_terrain_500_pts.asc' },
  ]},
];

let resData=null, resMeta=null, ptData=null, ptMeta=null;
let curResult=null;
let resScale='log', curScale='log';

function parseAsc(text) {
  const lines = text.split('\n').filter(l => l.trim() !== '');
  const meta = { ncols:0, nrows:0, xllcorner:0, yllcorner:0, cellsize:1, nodata:-9999 };
  let dataStart = 0;
  const keys = ['ncols','nrows','xllcorner','yllcorner','cellsize','nodata_value'];
  for (let i = 0; i < lines.length && i < 10; i++) {
    const parts = lines[i].trim().split(/\s+/);
    const k = parts[0].toLowerCase();
    if (k === 'ncols') { meta.ncols = +parts[1]; dataStart++; }
    else if (k === 'nrows') { meta.nrows = +parts[1]; dataStart++; }
    else if (k === 'xllcorner') { meta.xllcorner = +parts[1]; dataStart++; }
    else if (k === 'yllcorner') { meta.yllcorner = +parts[1]; dataStart++; }
    else if (k === 'cellsize') { meta.cellsize = +parts[1]; dataStart++; }
    else if (k === 'nodata_value') { meta.nodata = +parts[1]; dataStart++; }
    else { break; }
  }
  const vals = [];
  for (let i = dataStart; i < lines.length; i++) {
    lines[i].trim().split(/\s+/).forEach(s => { const n = +s; if (!isNaN(n)) vals.push(n); });
  }
  return { meta, data: new Float64Array(vals) };
}

function heat(t) {
  t = Math.max(0, Math.min(1, t));
  let r,g,b;
  if (t < .125) { const s = t/.125; r=0; g=0; b=128+s*127; }
  else if (t < .375) { const s = (t-.125)/.25; r=0; g=s*255; b=255; }
  else if (t < .625) { const s = (t-.375)/.25; r=0; g=255; b=(1-s)*255; }
  else if (t < .875) { const s = (t-.625)/.25; r=s*255; g=(1-s)*255; b=0; }
  else { const s = (t-.875)/.125; r=255; g=(1-s)*128; b=0; }
  return [r,g,b];
}

function renderGrid(id, data, nrows, ncols, nodata, logScale) {
  const canvas = document.getElementById(id);
  const ms = Math.max(1, Math.floor(400 / Math.max(nrows, ncols)));
  const w = ncols * ms, h = nrows * ms;
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;

  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);

  let minV=Infinity, maxV=-Infinity;
  for (const v of data) {
    if (v==nodata||isNaN(v)) continue;
    const t = logScale&&v>0 ? Math.log10(v) : v;
    if (t<minV) minV=t; if (t>maxV) maxV=t;
  }
  if (!isFinite(minV)) minV=0;
  if (!isFinite(maxV)) maxV=1;
  if (maxV<=minV) maxV=minV+1;

  for (let r=0; r<nrows; r++) {
    for (let c=0; c<ncols; c++) {
      const v = data[r*ncols+c];
      let rr=17, gg=17, bb=17;
      if (v!==nodata && !isNaN(v)) {
        const t = logScale&&v>0 ? Math.log10(v) : v;
        const s = (t-minV)/(maxV-minV);
        [rr,gg,bb] = heat(s);
      }
      for (let dy=0; dy<ms; dy++)
        for (let dx=0; dx<ms; dx++) {
          const i = ((r*ms+dy)*w + c*ms+dx)*4;
          img.data[i]=rr; img.data[i+1]=gg; img.data[i+2]=bb; img.data[i+3]=255;
        }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function renderPts(id, data, nrows, ncols, nodata) {
  const canvas = document.getElementById(id);
  const ms = Math.max(1, Math.floor(400 / Math.max(nrows, ncols)));
  const w = ncols * ms, h = nrows * ms;
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  const cols = [[255,50,50],[50,200,50],[50,100,255],[255,200,50],[255,50,255],[50,255,255]];
  for (let r=0; r<nrows; r++) {
    for (let c=0; c<ncols; c++) {
      const v = data[r*ncols+c];
      let rr=17, gg=17, bb=17;
      if (v!==nodata && v>0 && !isNaN(v)) [rr,gg,bb]=cols[(v-1)%cols.length];
      for (let dy=0; dy<ms; dy++)
        for (let dx=0; dx<ms; dx++) {
          const i = ((r*ms+dy)*w + c*ms+dx)*4;
          img.data[i]=rr; img.data[i+1]=gg; img.data[i+2]=bb; img.data[i+3]=255;
        }
    }
  }
  ctx.putImageData(img, 0, 0);
}

async function loadPreset(p) {
  document.getElementById('status').textContent = `loading ${p.name}...`;
  document.getElementById('status').style.color = '#888';
  const [rt, pt] = await Promise.all([fetch(p.res).then(r=>r.text()), fetch(p.pts).then(r=>r.text())]);
  const rp = parseAsc(rt), pp = parseAsc(pt);
  resData=rp.data; resMeta=rp.meta; ptData=pp.data; ptMeta=pp.meta; curResult=null;
  document.getElementById('maps').style.display='grid';
  document.getElementById('dimRes').textContent=`${rp.meta.ncols}×${rp.meta.nrows}`;
  document.getElementById('dimPts').textContent=`${pp.meta.ncols}×${pp.meta.nrows}`;
  document.getElementById('dimCur').textContent='';
  document.getElementById('resistances').innerHTML='';
  renderGrid('canvasRes', rp.data, rp.meta.nrows, rp.meta.ncols, rp.meta.nodata, resScale==='log');
  renderPts('canvasPts', pp.data, pp.meta.nrows, pp.meta.ncols, pp.meta.nodata);
  const nc = rp.data.reduce((c,v)=>v!==rp.meta.nodata&&v>0?c+1:c,0);
  const np = pp.data.reduce((c,v)=>v!==pp.meta.nodata&&v>0?c+1:c,0);
  document.getElementById('status').textContent = `loaded ${p.name} — ${nc.toLocaleString()} cells, ${np} pts — ready`;
  document.getElementById('status').style.color = '#58a6ff';
  document.getElementById('solveBtn').disabled=false;
  document.getElementById('timer').textContent='';
}

async function runSolver() {
  if (!resData||!ptData) return;
  document.getElementById('solveBtn').disabled=true;
  document.getElementById('status').textContent='solving...';
  document.getElementById('status').style.color='#f90';
  document.getElementById('modal').classList.add('show');
  document.getElementById('timer').textContent='';
  const t0 = performance.now();

  try {
    const nd = resMeta.nodata||-9999;
    const ptI = new Int32Array(ptData.length);
    for (let i=0; i<ptData.length; i++) { const v=ptData[i]; ptI[i]=(v===nd||isNaN(v))?0:Math.round(v); }
    curResult = JSON.parse(solve_connectivity(resData, resMeta.nrows, resMeta.ncols, nd, ptI));
    const s = ((performance.now()-t0)/1000).toFixed(1);
    document.getElementById('timer').textContent = `${s}s`;
    renderCurrent();
    renderRes();
    document.getElementById('status').textContent = `solved in ${s}s`;
    document.getElementById('status').style.color = '#3fb950';
  } catch(e) {
    document.getElementById('status').textContent = `error: ${e.message}`;
    document.getElementById('status').style.color = '#f44';
  } finally {
    document.getElementById('modal').classList.remove('show');
    document.getElementById('solveBtn').disabled=false;
  }
}

function renderCurrent() {
  if (!curResult) return;
  renderGrid('canvasCur', curResult.current_map, curResult.nrows, curResult.ncols, 0, curScale==='log');
  document.getElementById('dimCur').textContent=`${curResult.nrows}×${curResult.ncols}`;
}

function renderRes() {
  if (!curResult) return;
  const ids=curResult.point_ids, m=curResult.resistances;
  let h='<table><tr><th></th>';
  ids.forEach(id=>h+=`<th>pt ${id}</th>`); h+='</tr>';
  m.forEach((row,i)=>{
    h+=`<tr><th>pt ${ids[i]}</th>`;
    row.forEach(v=>h+=`<td>${v>=0?v.toFixed(4):'—'}</td>`);
    h+='</tr>';
  });
  h+='</table>';
  document.getElementById('resistances').innerHTML=h;
}

// scale toggles
document.addEventListener('click', e => {
  const t = e.target.closest('.scale-toggles span');
  if (!t) return;
  const map=t.dataset.map, scale=t.dataset.scale;
  t.parentElement.querySelectorAll('span').forEach(s=>s.classList.remove('on'));
  t.classList.add('on');
  if (map==='res') {
    resScale=scale;
    if (resData) renderGrid('canvasRes', resData, resMeta.nrows, resMeta.ncols, resMeta.nodata, scale==='log');
  } else if (map==='cur') {
    curScale=scale;
    renderCurrent();
  }
});

// file inputs
document.getElementById('resFile').addEventListener('change', async e => {
  const f=e.target.files[0]; if(!f)return;
  document.getElementById('resName').textContent=f.name;
  document.querySelectorAll('.preset.sel').forEach(el=>el.classList.remove('sel'));
  const t=await f.text(); const p=parseAsc(t);
  resData=p.data; resMeta=p.meta;
  document.getElementById('maps').style.display='grid';
  document.getElementById('dimRes').textContent=`${p.meta.ncols}×${p.meta.nrows}`;
  renderGrid('canvasRes', p.data, p.meta.nrows, p.meta.ncols, p.meta.nodata, resScale==='log');
  document.getElementById('solveBtn').disabled=!(resData&&ptData);
});
document.getElementById('ptFile').addEventListener('change', async e => {
  const f=e.target.files[0]; if(!f)return;
  document.getElementById('ptName').textContent=f.name;
  const t=await f.text(); const p=parseAsc(t);
  ptData=p.data; ptMeta=p.meta;
  document.getElementById('maps').style.display='grid';
  document.getElementById('dimPts').textContent=`${p.meta.ncols}×${p.meta.nrows}`;
  renderPts('canvasPts', p.data, p.meta.nrows, p.meta.ncols, p.meta.nodata);
  document.getElementById('solveBtn').disabled=!(resData&&ptData);
});
document.getElementById('solveBtn').addEventListener('click', runSolver);

// sidebar
const sb=document.getElementById('sidebar');
PRESETS.forEach(grp=>{
  const d=document.createElement('div'); d.className='preset-group';
  d.innerHTML=`<h3>${grp.group}</h3>`;
  grp.items.forEach(it=>{
    const c=document.createElement('div'); c.className='preset';
    c.textContent=it.name;
    c.addEventListener('click', ()=>{
      sb.querySelectorAll('.sel').forEach(el=>el.classList.remove('sel'));
      c.classList.add('sel');
      loadPreset(it);
    });
    d.appendChild(c);
  });
  sb.appendChild(d);
});

init();
</script>
</body>
</html>
