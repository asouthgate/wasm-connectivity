<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASM Connectivity</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 13px monospace; background: #111; color: #ccc; padding: 12px; }
    h1 { font-size: 1em; margin-bottom: 8px; }
    h3 { font-size: .7em; color: #666; text-transform: uppercase; margin: 4px 0; letter-spacing: 1px; }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .btn { padding: 5px 12px; border: 1px solid #444; background: #222; color: #ccc; cursor: pointer; font: 12px monospace; }
    .btn:hover { border-color: #888; }
    .btn.run { background: #238636; border-color: #238636; color: #fff; font-weight: bold; }
    .btn.run:hover { background: #2ea043; }
    .btn.run:disabled { opacity: .4; cursor: not-allowed; }
    .status { font-size: .8em; margin: 4px 0; }
    .timer { font-size: .75em; color: #f90; }
    .fname { font-size: .7em; color: #555; max-width: 130px; overflow: hidden; white-space: nowrap; }

    .layout { display: flex; gap: 12px; }
    .sidebar { width: 180px; flex-shrink: 0; }
    .main { flex: 1; min-width: 0; }

    .preset-group { margin-bottom: 8px; }
    .preset { padding: 3px 8px; border: 1px solid #333; border-radius: 2px; cursor: pointer; margin-bottom: 2px; font-size: .75em; }
    .preset:hover { background: #1a1a1a; border-color: #555; }
    .preset.sel { border-color: #58a6ff; color: #58a6ff; }

    .maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .resistances { margin-top: 10px; }
    .resistances table, .log table { border-collapse: collapse; font-size: .75em; }
    .resistances td, .resistances th, .log td, .log th { padding: 2px 8px; border: 1px solid #333; }
    .resistances td, .log td { text-align: right; }
    .resistances th, .log th { background: #1a1a1a; color: #888; text-align: right; font-weight: normal; }
    .log { max-height: 350px; overflow-y: auto; margin-top: 8px; }
    .log table { width: 100%; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
