[circuitscape options]
data_type = raster
scenario = advanced
habitat_file = scripts/scenarios/linear_res/resistance.asc
habitat_map_is_resistances = True
source_file = scripts/scenarios/linear_res/source.asc
ground_file = scripts/scenarios/linear_res/ground.asc
ground_file_is_resistances = False
use_unit_currents = False
use_direct_grounds = False
remove_src_or_gnd = keepall
connect_using_avg_resistances = True
connect_four_neighbors_only = True
solver = cg+amg
precision = double
parallelize = False
output_file = scripts/scenarios/linear_res/output/circuitscape.out
write_as_tif = False
write_cur_maps = True
write_volt_maps = False
