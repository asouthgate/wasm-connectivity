[package]
name = "lmConnect"
version = "0.1.1"
edition = "2021"
description = "Low-memory Biological Connectivity Analysis"
license-file = "COPYING.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/COPYING.md", "/example/horseshoe-bat-model.json"]

[lib]
name = "lm_connect"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sprs = "0.11"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
geo = "0.28"
geojson = "0.24"
csv = "1"
tiff = { version = "0.9", optional = true }
gdal = { version = "0.18", optional = true }
image = { version = "0.24", default-features = false, features = ["png"], optional = true }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1.8", optional = true }

[features]
bin = ["dep:tiff", "dep:image", "dep:gdal", "dep:clap"]
instrumentation-profile = []
developer = ["bin", "instrumentation-profile"]
wasm-threads = ["dep:rayon"]

[[bin]]
name = "lmc"
path = "src/bin/lmc/main.rs"
required-features = ["bin"]

[[bin]]
name = "lmc-profile"
path = "src/bin/lmc-profile.rs"
required-features = ["developer"]

[[bin]]
name = "lmc-roost"
path = "src/bin/lmc-roost.rs"
required-features = ["bin"]

[profile.release-prof]
inherits = "release"
debug = 1
